<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>creative little garden</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="https://use.typekit.net/rmp7xgg.css" />
  </head>
  <body>
    <div class="fullscreen-container gate" id="closed-gate">
      <img src="assets/closed-gate.png" alt="closed gate" />
    </div>
    <button
      class="action-btn"
      id="unlock-btn"
      data-hide="closed-gate unlock-btn"
      data-show="open-gate enter-link"
    >
      UNLOCK
    </button>

    <!-- open gate: appears after unlocking -->
    <div class="fullscreen-container" id="open-gate" hidden>
      <img src="assets/open-gate.png" alt="open gate" />
    </div>
    <a class="action-btn" id="enter-link" href="map.html" hidden>ENTER</a>

    <script src="script.js"></script>
  </body>
</html>
